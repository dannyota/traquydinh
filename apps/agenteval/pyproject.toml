[project]
name = "trachuan-agenteval"
version = "0.1.0"
description = "Offline-tested MCP agent evaluation driver."
requires-python = "==3.14.*"
dependencies = [
    "anthropic==2.8.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "mcp==2.3.0",
    "openai==3.51.0",
]

[project.scripts]
agenteval = "trachuan_agenteval.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trachuan_agenteval"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
